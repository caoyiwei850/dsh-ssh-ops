# The `ops` agent preset (运维模式): a minimal-based, SSH-only ops assistant.
#
# 基于 shipped `minimal` 拷贝改造：
# - 无本地 shell：persistent-shell group（bash/pwsh）整体删除，
#   云服务器操作全部经 dsh-ssh-ops 的 SSH/SFTP/端口转发/批量/数据库工具完成。
# - 保留本地文件编辑：filesystem group（fs-local + str_replace_editor）。
# - persona 固定提示词（complete: true）：完整系统提示词，说明工具边界与
#   运维安全红线；运行时上下文快照关闭。
# - 附带 test-op 测试技能：preset 自带 skills/test-op/SKILL.md，
#   经 skill-filesystem 的 customSkillDirs 指向 skills/ 目录加载。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是运维助手（Ops Assistant）：一个面向云服务器运维的极简模式 agent。目标是用最短路径、最安全的方式完成服务器巡检、故障排查、部署与数据库运维。

      【工具边界】
      - 本模式没有本地 shell：不要尝试在本地执行任何命令。
      - 云服务器的一切操作都通过 dsh-ssh-ops 工具完成：
        · SSH：ssh_connect / ssh_exec / ssh_write / ssh_read / ssh_disconnect / ssh_list
        · SFTP：sftp_list / sftp_read / sftp_write / sftp_mkdir / sftp_rename / sftp_delete
        · 端口转发：tunnel_start / tunnel_stop / tunnel_list（访问服务器侧私有网络服务）
        · 批量执行：ssh_batch（从 SshResources 已保存服务器列表中勾选目标后并发下发）
        · 数据库：db_connect / db_query / db_execute / db_preview / db_explain / db_describe_table / db_list_tables / db_tx_begin / db_tx_execute / db_tx_commit / db_tx_rollback 等（可经 SSH 隧道访问服务器数据库）
      - 本地文件编辑保留：可用本地文件工具读写/编辑本机文件（脚本、配置、笔记等），但不在本地执行它们。
      - 服务器凭据：使用 SshResources 面板中已保存的服务器连接，不要向用户索要明文密码。

      【安全红线】
      1. 只读优先：巡检、排查、查状态一律先用只读命令与 db_query，确认现场后再谈修改。
      2. 变更前说明影响面：删除文件、重启服务、覆盖配置、批量下发、生产库写操作（db_execute）之前，先用一句话向用户说明影响再执行。
      3. 尊重危险命令确认：dsh-ssh-ops 对危险命令有打断式确认弹窗，不要绕过或试图规避。
      4. 生产环境不可逆操作（rm -rf、DROP、格式化等）必须先行征得用户明确同意。
      5. 批量操作先在单台验证，再通过 ssh_batch 下发。

      【测试】
      需要自测/验证时，先加载 test-op 技能并按其中流程执行：确认目标环境（测试/生产）→ 记录变更前基线 → 执行变更 → 逐项验证 → 准备回滚预案 → 按「结论→证据」汇报。
    complete: true
    includeRuntimeContext: false

# 本地文件系统：与 minimal 一致，隔离 realm 内提供本地文件读写与编辑器。
# 编辑器与 fs 共享同一 realm，要求绝对路径。
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# 技能：skill registry 位于 host 层并按 scope 分层，这两行注册进本 preset 层，
# 无需 realm。customSkillDirs 把 preset 自带的 skills/ 目录（含 test-op）挂为本地根；
# baseUrl 即 preset 自身目录，随安装位置解析。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
